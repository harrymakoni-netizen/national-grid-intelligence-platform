services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: gridintel
      POSTGRES_USER: gridintel
      POSTGRES_PASSWORD: gridintel_dev_only
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./ops/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ingestion-api:
    build:
      context: .
      dockerfile: ops/Dockerfile
    command: uvicorn gridintel.ingestion.api:app --host 0.0.0.0 --port 8000
    environment:
      GRIDINTEL_DATABASE_URL: postgresql+psycopg2://gridintel:gridintel_dev_only@timescaledb:5432/gridintel
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy

  ingestion-mqtt:
    build:
      context: .
      dockerfile: ops/Dockerfile
    command: python -m gridintel.ingestion.mqtt_service
    environment:
      GRIDINTEL_DATABASE_URL: postgresql+psycopg2://gridintel:gridintel_dev_only@timescaledb:5432/gridintel
      GRIDINTEL_MQTT_HOST: mosquitto
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  timescale_data:
